<!DOCTYPE html>
<html lang="zh-CN" data-skin="minimal" data-theme="lemon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汪静怡 | 商务售后 · 数据与 AI 实践</title>
  <meta name="description" content="汪静怡（Ginny Wang），芜湖禾田汽车工业商务售后，经济统计背景，关注外贸单据流程自动化与 AI 工具落地。">
  <meta name="theme-color" content="#f7e93e">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app"></div>

  <!-- 全局控制条：皮肤 / 语言 / 配色 -->
  <div class="ctrl" role="toolbar" aria-label="显示设置">
    <div class="ctrl-group">
      <button class="ctrl-btn" data-set-skin="minimal">极简</button>
      <button class="ctrl-btn" data-set-skin="pop">多巴胺</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn" data-set-lang="zh">中文</button>
      <button class="ctrl-btn" data-set-lang="en">EN</button>
    </div>
    <div class="ctrl-group swatches" id="swatches">
      <button class="sw sw-lemon" data-set-theme="lemon" title="柠檬黄" aria-label="柠檬黄"></button>
      <button class="sw sw-peach" data-set-theme="peach" title="蜜桃橙" aria-label="蜜桃橙"></button>
      <button class="sw sw-mint" data-set-theme="mint" title="薄荷绿" aria-label="薄荷绿"></button>
      <button class="sw sw-violet" data-set-theme="violet" title="紫罗兰" aria-label="紫罗兰"></button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
